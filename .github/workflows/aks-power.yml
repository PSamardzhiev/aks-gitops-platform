# Cost control: a stopped AKS cluster does not bill for its VMs.
# Manual only: run with action=stop or action=start.
name: aks-power

on:
  workflow_dispatch:
    inputs:
      action:
        description: start or stop the cluster
        type: choice
        options: [stop, start]
        default: stop

permissions:
  contents: read

env:
  RG: rg-aksgitops-dev
  CLUSTER: aks-aksgitops-dev

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": ${{ toJSON(secrets.AZURE_CLIENT_ID) }},
              "clientSecret": ${{ toJSON(secrets.AZURE_CLIENT_SECRET) }},
              "tenantId": ${{ toJSON(secrets.AZURE_TENANT_ID) }},
              "subscriptionId": ${{ toJSON(secrets.AZURE_SUBSCRIPTION_ID) }}
            }

      - name: Start or stop
        run: |
          if ! az aks show -g "$RG" -n "$CLUSTER" >/dev/null 2>&1; then
            echo "Cluster $CLUSTER not found - nothing to do."
            exit 0
          fi
          az aks ${{ inputs.action || 'stop' }} -g "$RG" -n "$CLUSTER"
