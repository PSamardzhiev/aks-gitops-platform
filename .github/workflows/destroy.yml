name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down the dev environment'
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  TF_DIR: terraform/envs/dev
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_aks_admin_group_object_id: ${{ vars.AKS_ADMIN_GROUP_OBJECT_ID }}
  TF_VAR_unique_suffix: ${{ vars.UNIQUE_SUFFIX }}

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: |
          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"

      - name: Destroy
        run: terraform -chdir="$TF_DIR" destroy -auto-approve -input=false -lock-timeout=5m
