apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-keyvault
  namespace: sample-app
  labels:
    app: podinfo-keyvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo-keyvault
  template:
    metadata:
      labels:
        app: podinfo-keyvault
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sample-app-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: azure-keyvault
