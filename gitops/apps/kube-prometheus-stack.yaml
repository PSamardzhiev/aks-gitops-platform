# Metrics + Grafana. Sized for a single small node: no Alertmanager, short
# retention, no persistent volumes (data is lost on pod restart - fine for a lab).
# targetRevision "*" = latest stable chart. After the first successful sync,
# pin an exact version so upgrades are deliberate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*"
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        # AKS hides the managed control plane, so these cannot be scraped.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
        grafana:
          # ClusterIP only: reach it with kubectl port-forward (see docs/runbook.md).
          # Change the default admin password after first login.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
